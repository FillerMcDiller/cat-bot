# Minimal Wiki.js config.yml
# Replace placeholders or copy this file to the host and update values.

db:
  type: postgres
  host: ${WIKI_DB_HOST}
  port: ${WIKI_DB_PORT}
  user: ${WIKI_DB_USER}
  pass: ${WIKI_DB_PASS}
  db: ${WIKI_DB_NAME}
  ssl: false

server:
  host: 0.0.0.0
  port: 3000

security:
  # Generate a long random secret for sessions and salts
  secret: "REPLACE_WITH_A_LONG_RANDOM_SECRET"

storage:
  provider: local
  local:
    path: /var/wiki/uploads

# Optional: set log level (debug, info, warn, error)
logging:
  level: info

# Optional admin settings
admin:
  locale: en
