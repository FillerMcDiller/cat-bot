      <stop offset="0%" stop-color="#eef7f2"/>
      <stop offset="100%" stop-color="#e2efe6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(95,122,74,0.24)"/>
      <stop offset="100%" stop-color="rgba(95,122,74,0)"/>
    </radialGradient>
    <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse">
