  <rect x="96" y="96" width="1856" height="1856" rx="84" fill="none" stroke="#5f7a4a" stroke-width="16" stroke-dasharray="24 20" opacity="0.72"/>
  <rect x="180" y="180" width="1688" height="1688" rx="68" fill="rgba(255,255,255,0.24)" stroke="rgba(36,31,26,0.16)" stroke-width="6"/>
  <circle cx="1024" cy="930" r="320" fill="rgba(95,122,74,0.08)" stroke="rgba(95,122,74,0.24)" stroke-width="10"/>
  <circle cx="1024" cy="930" r="150" fill="none" stroke="rgba(200,93,46,0.28)" stroke-width="8" stroke-dasharray="18 18"/>
  <g fill="#241f1a" font-family="Inter, Arial, sans-serif" text-anchor="middle">
