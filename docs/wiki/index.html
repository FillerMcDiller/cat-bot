<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cat Bot Wiki</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wiki-app">
    <aside class="sidebar">
      <div class="brand">Cat Wiki</div>
      <nav>
        <ul>
          <li data-page="overview"><span class="icon">🏠</span><span class="label">Home</span></li>
          <li data-page="info"><span class="icon">❓</span><span class="label">Wiki Info</span></li>
          <li data-page="kittay"><span class="icon">🐱</span><span class="label">KITTAYYYYYYY</span></li>
          <li data-page="spawning"><span class="icon">➕</span><span class="label">Cat Spawning</span></li>
          <li data-page="commands"><span class="icon">✏️</span><span class="label">Commands</span></li>
          <li data-page="cat-types"><span class="icon">📋</span><span class="label">Cat Types</span></li>
          <li data-page="badges"><span class="icon">🏅</span><span class="label">Badges</span></li>
          <li data-page="battlepass"><span class="icon">🎮</span><span class="label">Cattlepass</span></li>
          <li data-page="achievements"><span class="icon">🏆</span><span class="label">Achievements</span></li>
          <li data-page="rains"><span class="icon">🌧️</span><span class="label">Rains</span></li>
          <li data-page="packs"><span class="icon">📦</span><span class="label">Packs</span></li>
          <li data-page="trading"><span class="icon">↔️</span><span class="label">Trading</span></li>
          <li data-page="catnip"><span class="icon">🍃</span><span class="label">Catnip</span></li>
          <li data-page="prisms"><span class="icon">🔮</span><span class="label">Prisms</span></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="page-title">Overview</div>
        <div class="actions">
          <button id="editBtn">Edit</button>
          <button id="saveBtn" style="display:none">Save</button>
          <button id="cancelBtn" style="display:none">Cancel</button>
        </div>
      </header>

      <section id="page" class="page">
        Loading...
      </section>

    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
